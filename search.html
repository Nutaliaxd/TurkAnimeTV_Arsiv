<title>TürkAnime Arşiv — İzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0d1315;--bg2:#121b1e;--card:#162226;--card2:#1e2f34;--line:#2a3e44;
  --tx:#eef4f2;--tx2:#a1b3b1;--tx3:#6f8582;
  --ac:#ff8fb1;--ac2:#ffc2d4;--ac-ink:#2b0f19;
  --ok:#57d9a3;--bad:#ff6b7a;--warn:#ffcb5c;
  --rad:14px;--rad-sm:10px;--rad-pill:999px;
  --fd:"Bricolage Grotesque",system-ui,sans-serif;
  --ff:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --btn-h:40px;--btn-h-sm:32px;--chip-h:32px;
  --container:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:76px}
html,body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--ff);-webkit-text-size-adjust:100%}
a{color:var(--ac2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{vertical-align:-2px}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--sp-4)}

/* ===== üst çubuk ===== */
header.top{position:sticky;top:0;z-index:50;background:rgba(13,19,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);max-width:var(--container);margin:0 auto}
.logo{display:flex;align-items:center;gap:var(--sp-2);font:800 19px var(--fd);letter-spacing:-.3px;color:var(--tx);white-space:nowrap;cursor:pointer}
.logo:hover{text-decoration:none}
.logo svg{width:22px;height:22px;color:var(--ac)}
.logo b{font-weight:600;color:var(--tx2);margin-left:4px}
/* M1: üst bar nav — hiyerarşi: logo (en baskın) → nav → arama */
.topnav{display:flex;align-items:center;gap:2px;flex:none}
.topnav a{padding:7px 13px;border-radius:var(--rad-pill);color:var(--tx2);font-size:13.5px;font-weight:600;white-space:nowrap}
.topnav a:hover{color:var(--tx);background:var(--card);text-decoration:none}
.topnav a.on{color:var(--tx);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.searchbox{position:relative;flex:1;height:42px;display:flex;align-items:center;gap:var(--sp-2);background:var(--card);border:1px solid var(--line);border-radius:var(--rad-pill);padding:0 var(--sp-4)}
.searchbox:focus-within{border-color:var(--ac)}
.searchbox>svg{flex:none;opacity:.55;color:var(--tx3)}
#q{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px;-webkit-appearance:none}
#q::placeholder{color:var(--tx3)}
#q::-webkit-search-cancel-button{-webkit-appearance:none}
.kbd{flex:none;font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ibtn{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:15px;display:grid;place-items:center}
.ibtn:hover{color:var(--ac);border-color:var(--ac)}

main{padding:var(--sp-5) 0 60px}
.foot{max-width:var(--container);margin:0 auto;padding:24px var(--sp-4) 28px;color:var(--tx3);font-size:12.5px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.foot b{font:800 14px var(--fd);color:var(--tx2)}
.foot b span{color:var(--ac)}
.foot-legal{max-width:560px;line-height:1.6;color:var(--tx3)}
.foot-legal strong{display:block;color:var(--tx2);font:700 12.5px var(--fd);letter-spacing:.02em;margin-bottom:4px}

/* ===== metin / kırıntı ===== */
.crumb{color:var(--tx2);font-size:13px;margin-bottom:var(--sp-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb .sep{color:var(--tx3);font-size:11px}
.crumb a{color:var(--tx2)}
.crumb a:hover{color:var(--ac2)}
h1.anime-title{font:800 26px/1.25 var(--fd);letter-spacing:-.4px;margin-bottom:var(--sp-2)}

/* ===== buton / çip sistemi ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:var(--btn-h);padding:0 var(--sp-4);border-radius:var(--rad-pill);background:var(--ac);color:var(--ac-ink);font-size:13.5px;font-weight:700;transition:filter .12s;cursor:pointer}
.btn:hover{filter:brightness(1.12);text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--tx2);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{color:var(--ac2);border-color:var(--ac2);filter:none}
.btn.done{background:var(--ok);color:#0e2b1c}
.btn.sm{height:var(--btn-h-sm);padding:0 var(--sp-3);font-size:12.5px}
.btn.off{opacity:.35;pointer-events:none}
.mini{flex:none;height:30px;padding:0 var(--sp-3);font-size:11.5px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);border-radius:8px;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.mini:hover{color:var(--ac2);border-color:var(--ac2)}
.mini.x:hover{color:var(--bad);border-color:var(--bad)}
.mini.done{color:var(--ok);border-color:var(--ok)}
.mini[disabled]{opacity:.5;cursor:wait}
.copybtn{height:30px;padding:0 var(--sp-3);background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;font-size:12px;font-family:ui-monospace,Consolas,monospace;transition:all .12s;display:inline-flex;align-items:center;cursor:pointer}
.copybtn:hover{color:var(--ac2);border-color:var(--ac2)}
.copybtn.done{color:var(--ok);border-color:var(--ok)}

.fchip{display:inline-flex;align-items:center;gap:7px;height:var(--chip-h);padding:0 var(--sp-3);background:var(--card);border:1px solid var(--line);border-radius:var(--rad-pill);font-size:12.5px;color:var(--tx2);text-decoration:none;cursor:pointer}
.fchip:hover{text-decoration:none;border-color:var(--ac2)}
.fchip.on{border-color:var(--ac);color:var(--tx);background:rgba(255,143,177,.12)}
.fchip b{font-weight:800;color:var(--ac2);font-size:11px}
.fchip.on b{color:var(--tx)}
.fchip.temizle{border-style:dashed;color:var(--bad)}
.chiprow{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0;align-items:center}
.chiprow .lbl{font-size:11.5px;color:var(--tx3);flex:none;min-width:64px;text-transform:uppercase;letter-spacing:.4px}
/* KAYNAK çipleri (player sayfası) */
.fchip.kchip{gap:6px}
.fchip.kchip .fsep{color:var(--tx3);font-size:10.5px}
.fchip.kchip .fabbr{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--tx3);text-transform:uppercase;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip.kchip.on{border-color:var(--ac);background:rgba(255,143,177,.16);box-shadow:0 0 0 1.5px var(--ac);color:var(--tx)}
.fchip.kchip.on .fabbr,.fchip.kchip.on .fsep{color:var(--ac2)}
.kaynak-note{font-size:11.5px;color:var(--tx3);display:inline-flex;align-items:center;gap:5px;flex:none}
.kaynak-note a{color:var(--tx2);text-decoration:underline}
.kaynak-note a:hover{color:var(--ac2)}
.tgl.sm{height:var(--btn-h-sm);font-size:12px;padding:0 var(--sp-2)}
.chiprow .tgl{flex:none}

.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:2px 7px;flex:none}
.tag.url{color:#9be7c7;background:rgba(87,217,163,.1);border:1px solid rgba(87,217,163,.3)}
.tag.mask{color:#ffd28a;background:rgba(255,203,92,.1);border:1px solid rgba(255,203,92,.3)}
.tag.diger{color:var(--tx2);background:var(--card2);border:1px solid var(--line)}
.tag.eklenen{color:#0e2b1c;background:var(--ok);border:1px solid var(--ok)}
.fsinfo{margin-top:var(--sp-2);font-size:12.5px;color:var(--tx2);min-width:0}
.fsinfo .lbl{display:block;color:var(--tx3);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.fsinfo div div{margin:2px 0}
.fsinfo b{color:var(--tx);font-weight:700}
.kyok{color:var(--tx3);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--rad-pill);padding:4px 13px;font-size:12.5px;color:var(--tx2)}
.stat b{color:var(--tx)}
.stat svg{color:var(--ac);margin-right:6px}
.pchip{font-size:11.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 9px}
.players-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp-2)}

/* ===== poster kartları / grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--sp-4) var(--sp-3)}
.card{display:flex;flex-direction:column;gap:7px;min-width:0;color:var(--tx)}
.card:hover{text-decoration:none}
.poster{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;container-type:inline-size;background:linear-gradient(160deg,hsl(var(--h),42%,30%),hsl(var(--g),45%,14%));outline:2px solid transparent;outline-offset:2px}
.card:hover .poster,.card:focus-visible .poster{outline-color:var(--ac)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.poster img.on{opacity:1}
/* ===== AniList zenginleştirme (PR1) ===== */
.ainfo{margin-top:10px;display:grid;gap:8px;justify-items:start}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{font-size:11.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 9px;display:inline-flex;align-items:center;gap:5px}
.gchip svg{width:12px;height:12px;color:var(--warn)}
.syn{font-size:13.5px;color:var(--tx2);line-height:1.6;max-width:72ch}
.syn small{display:block;margin-top:4px;color:var(--tx3);font-size:11px}
/* M2: bölüm satırı indirme ikonları kaldırıldı — indirme player'daki "Videoyu indir" butonuyla */
/* ===== linki biten serilerin listelerde işaretlenmesi (PR1) ===== */
.nolk{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:700;font-size:11.5px;flex:none}
.nolk svg{width:12px;height:12px}
.nolk.big{color:var(--bad)}
.pl{position:absolute;left:6cqw;bottom:-8cqw;font:800 56cqw/1 var(--fd);letter-spacing:-.05em;color:rgba(255,255,255,.17)}
.pn{z-index:1;position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);border-radius:var(--rad-pill);padding:2px 9px;font-size:11px;font-weight:700;color:#fff}
.ct{font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:var(--sp-3);overflow-x:auto;scroll-snap-type:x proximity;padding:2px var(--sp-4) var(--sp-3);margin:0 calc(var(--sp-4)*-1);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:130px;scroll-snap-align:start}

/* ===== ana sayfa: öne çıkan, kategoriler ===== */
.feat{display:flex;gap:var(--sp-5);align-items:center;padding:var(--sp-5);border-radius:20px;background:hsl(var(--h),28%,15%)}
/* M4: günün önerisi gerçek banner ile (anilist.js) */
.feat-banner{position:relative;overflow:hidden}
.feat-banner::before{content:'';position:absolute;inset:0;background-image:var(--featimg);background-size:cover;background-position:center 22%;opacity:.42;filter:saturate(1.05)}
.feat-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,19,21,.72),rgba(13,19,21,.28) 55%,rgba(13,19,21,.82))}
.feat-banner>*{position:relative;z-index:1}
.fposter{flex:none;width:180px}
.fposter .pl{font-size:96cqw}
.ftext{min-width:0;flex:1}
.flabel{display:inline-flex;gap:var(--sp-2);align-items:center;color:var(--ac);font-weight:700;font-size:13px}
.ftext h1{font:800 clamp(24px,4vw,38px)/1.1 var(--fd);letter-spacing:-.6px;margin:var(--sp-2) 0 var(--sp-3)}
.fmeta{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.fmeta span{background:rgba(255,255,255,.08);border-radius:var(--rad-pill);padding:4px 13px;font-size:12.5px}
.fmeta svg{margin-right:6px;color:var(--ac)}
.facts{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin:30px 0 var(--sp-3)}
.sh h2{font:700 18px var(--fd);letter-spacing:-.2px}
.kats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-3)}
.kat{display:flex;flex-direction:column;gap:3px;padding:var(--sp-3) var(--sp-4);min-height:86px;border-radius:13px;background:hsl(var(--h),30%,16%);color:var(--tx);text-align:left;width:100%}
.kat:hover{text-decoration:none;background:hsl(var(--h),30%,21%)}
.kat svg{width:18px;height:18px;margin-bottom:auto;color:hsl(var(--h),75%,74%)}
.kat b{font:700 14px var(--fd)}
.kat small{color:var(--tx2);font-size:11.5px}
.az{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.az button{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-weight:700;font-size:13px}
.az button:hover{border-color:var(--ac);color:var(--ac)}
/* M3: Animeler sayfası araç çubuğu + Kategoriler harf kartları */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4)}
.toolbar .searchbox{flex:1;min-width:220px;height:38px}
.sortlab{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3);flex:none;white-space:nowrap}
.sortlab select{height:38px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad-pill);color:var(--tx);padding:0 var(--sp-3);font:inherit;cursor:pointer}
.sortlab select:focus{outline:none;border-color:var(--ac)}
.azgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.azcard{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0 8px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:800 17px var(--fd)}
.azcard small{font:600 10.5px var(--ff);color:var(--tx3)}
.azcard:hover{text-decoration:none;border-color:var(--ac)}
.count-line{color:var(--tx2);font-size:12.5px;margin:2px 0 var(--sp-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{padding:40px var(--sp-4);text-align:center;color:var(--tx2)}
.empty .big{font-size:36px;margin-bottom:var(--sp-2);color:var(--tx3)}
.empty .big svg{width:34px;height:34px}
.loading{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding:60px 0;color:var(--tx2)}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:var(--sp-4) 0}
.pager button{min-width:38px;height:38px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.pager button:hover{border-color:var(--ac);color:var(--tx)}
.pager button.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}
.pager .dots{color:var(--tx3);padding:0 2px}
.jump{display:flex;gap:var(--sp-2);align-items:center;justify-content:center;margin:var(--sp-3) 0 0;font-size:12.5px;color:var(--tx2)}
.jump input{width:76px;height:var(--btn-h-sm);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 var(--sp-2);outline:none;text-align:center}
.jump input:focus{border-color:var(--ac)}
.jump button{height:var(--btn-h-sm);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:0 var(--sp-3);color:var(--tx2);cursor:pointer}

/* ===== anime bölüm listesi ===== */
/* M4: anime hero — banner varsa banner, yoksa kapak/yoksa ton gradyanı */
.hero{position:relative;border-radius:16px;overflow:hidden;padding:var(--sp-4);margin-bottom:6px;background:linear-gradient(160deg,hsl(var(--h),26%,17%),hsl(var(--g),32%,10%))}
.hero::before{content:'';position:absolute;inset:0;background-image:var(--heroimg,none);background-size:cover;background-position:center 22%;opacity:.4;filter:saturate(1.05)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,19,21,.18),rgba(13,19,21,.8))}
.hero>*{position:relative;z-index:1}
.ahead{display:flex;gap:var(--sp-4);align-items:flex-start;margin-bottom:6px}
.aposter{flex:none;width:120px}
.aposter .pl{font-size:60cqw}
.atxt{min-width:0;flex:1}
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin:var(--sp-4) 0}
.tgl{display:flex;align-items:center;gap:var(--sp-2);height:var(--btn-h);font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:var(--rad-sm);padding:0 var(--sp-3);cursor:pointer;user-select:none}
.tgl input{accent-color:var(--bad)}
.ep{display:flex;align-items:center;gap:var(--sp-3);min-height:50px;padding:8px var(--sp-4);background:var(--card);border:1px solid var(--line);border-radius:var(--rad-sm);margin-bottom:6px;cursor:pointer;transition:border-color .12s}
.ep:hover{border-color:var(--ac)}
.ep .no{flex:none;min-width:48px;text-align:center;font-weight:800;font-size:12.5px;color:var(--ac);background:rgba(255,143,177,.1);border:1px solid rgba(255,143,177,.3);border-radius:8px;padding:3px 7px}
.ep .ea{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.ep .meta{flex:none;font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center}

/* ===== bölüm seçenekleri ===== */
.opt{display:flex;flex-wrap:wrap;row-gap:var(--sp-2);align-items:center;gap:var(--sp-3);padding:10px var(--sp-4);background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.opt:hover{border-color:var(--ac)}
.opt .pname{font-weight:800;font-size:14px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .fansub{color:var(--tx2);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .tag{flex:none}
.optacts{margin-left:auto;flex:none;display:flex;gap:5px;align-items:center}

/* ===== oynatıcı ===== */
.player-box{position:relative;background:#000;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;display:flex;justify-content:center}
.player-box iframe{display:block;width:100%;aspect-ratio:16/9;max-width:min(100%,calc(78vh * 16 / 9));border:0;background:#000}
.note-soft{margin-top:var(--sp-2);font-size:12px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:var(--rad-sm);padding:8px var(--sp-3)}
.note-soft b{color:var(--tx)}

<script>
/* ---- yönetici eklemeleri: eklenen.js (turkanime_yonet.py üretir) ----
   KALDIRILAN gibi çalışma anında uygulanan override verisidir; b/ dosyalarını
   yeniden üretmeden sonradan eklenen linkleri gösterir.
   http(s) altında cache-bust (?v=...) ile her zaman güncel okunur; file://
   altında parametresiz yüklenir. */
window.EKLENEN = window.EKLENEN || [];
(function(){
  var bust = location.protocol === 'file:' ? '' : '?v=' + Date.now();
  var s = document.createElement('script');
  s.onload = function(){
    if ((location.hash||'').indexOf('#/anime/')===0 && typeof route === 'function') route();
  };
  s.src = 'eklenen.js' + bust;
  document.head.appendChild(s);
})();
const EKLENEN_I_BASE = 100000;   // eklenen linklere verilen sentetik indeks başlangıcı
function eklenenLinkler(slug, ep){
  /* slug+bölüm eşleşen yönetici eklemelerini link nesnelerine çevirir;
     kaldırılanlar ve b/ verisinde zaten var olanlar elenir */
  const k = kaldirilanSet();
  const mevcut = new Set((ep.links||[]).map(l=>l.url));
  const out = [];
  for (const e of (Array.isArray(window.EKLENEN)?window.EKLENEN:[])){
    if (!e || e.slug!==slug || !e.url) continue;
    const eb = String(e.bolum==null?'':e.bolum);
    const noS = ep.no!=null?String(ep.no):'';
    if (!(eb===noS || eb===ep.slug)) continue;
    if (k.has(e.url) || mevcut.has(e.url)) continue;
    out.push({url:e.url, tip:'url', player:e.player||'?', fansub:e.fansub||'?', eklenen:true});
  }
  return out;
}

"use strict";
/* ============ yardımcılar ============ */
const $ = s => document.querySelector(s);
const appEl = () => document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TR_MAP = {'ı':'i','İ':'i','I':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c'};
function norm(s){
  let t = '';
  for (const ch of String(s)) t += TR_MAP[ch] || ch;
  return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ============ index hazırlığı ============ */
const ANIME = [];
(function buildIndex(){
  for (const row of window.INDEX){
    const slug=row[0], baslik=row[1], eps=row[2], urls=row[3], masks=row[4], top=row[5]||[];
    const n = norm(baslik);
    const nTok = new Set(n.split(' ').concat(norm(slug).split(' ')).filter(Boolean));
    ANIME.push({ slug, baslik, eps, urls, masks, top,
      nTitle: n, nTok, tokArr: [...nTok], hay: n+' '+norm(slug) });
  }
  ANIME.sort((a,b)=> a.nTitle < b.nTitle ? -1 : a.nTitle > b.nTitle ? 1 : 0);
})();

    if (p.get('admin')==='1') localStorage.setItem('tk_admin','1');
    if (p.get('admin')==='0') localStorage.removeItem('tk_admin');

/* ---- M2: kaldırılan linkler ----
   GLOBAL: repodaki kaldirilan.js (herkes için gizli, git ile yayınlanır)
   YEREL : bu tarayıcıda × ile kaldırılanlar (localStorage) — dışa aktarıp repoya eklenir */
const KLD_KEY = 'tk_kaldirilan';
const GLOBAL_KLD = new Set(Array.isArray(window.KALDIRILAN) ? window.KALDIRILAN : []);
let _yerelKld = null, _tumKld = null;
function yerelKaldirilanSet(){
  if (_yerelKld) return _yerelKld;
  try{ const a = JSON.parse(localStorage.getItem(KLD_KEY)||'[]'); _yerelKld = new Set(Array.isArray(a)?a:[]); }
  catch(e){ _yerelKld = new Set(); }
  return _yerelKld;
}
function kaldirilanSet(){
  if (!_tumKld) _tumKld = new Set([...GLOBAL_KLD, ...yerelKaldirilanSet()]);
  return _tumKld;
}
function linkKaldir(u){
  const s = yerelKaldirilanSet(); s.add(u);
  try{ localStorage.setItem(KLD_KEY, JSON.stringify([...s])); }catch(e){}
  _tumKld = null;
}
function bekleyenKaldirilan(){ return [...yerelKaldirilanSet()].filter(u=>!GLOBAL_KLD.has(u)); }
function kaldirilanSay(){ return bekleyenKaldirilan().length; }
function kaldirilanFiltre(links){ const k = kaldirilanSet(); return (links||[]).filter(l=>!k.has(l.url)); }

/* ---- M7b: yardımcı sunucu var mı? (ping) ----
   Worker içinde sorgulanır: 404 konsol hatası üretmeden algılanır. */
let SERVER_OK = false;
function _serverHazir(){
  if (SERVER_OK) return;
  SERVER_OK = true;
  const h = location.hash||'';
  if (h.startsWith('#/anime/')) route();  // çöz butonlarını görünür kıl
}
function pingServer(){
  if (location.protocol === 'file:' || /\.github\.io$/i.test(location.hostname)) return;  // API yok, sorgulamadan atla
  try{
    const src = 'self.onmessage=e=>{fetch(e.data+"api/ping").then(r=>r.ok?r.json():null)' +
                '.then(j=>postMessage(!!(j&&j.ok))).catch(()=>postMessage(false));};';
    const w = new Worker(URL.createObjectURL(new Blob([src], {type:'application/javascript'})));
    w.onmessage = e=>{ if (e.data) _serverHazir(); setTimeout(()=>{ try{ w.terminate(); }catch(_){}} , 0); };
    w.postMessage(location.origin + location.pathname.replace(/[^/]*$/,''));
    setTimeout(()=>{ try{ w.terminate(); }catch(_){} }, 10000);
  }catch(e){
    try{  // Worker desteklenmiyorsa eski yöntem
      fetch('api/ping').then(r=> r.ok ? r.json() : null).then(j=>{ if (j && j.ok) _serverHazir(); }).catch(()=>{});
    }catch(_){}
  }
}

/* ---- fansub/çevirmen bilgisi (b/ dosyalarındaki ep.fansubs) ---- */
/* ad: string → sadece o fansub; '' → isimsiz (adsız) satırlar;
   dizi → seçilen fansublar; '*' → hepsi (liste sayfası, filtre yokken) */
function fansubBilgiHtml(ep, ad, baslik){
  const fs = Array.isArray(ep && ep.fansubs) ? ep.fansubs : [];
  const hepsi = fs.filter(f=> (f.ad && f.ad.trim()) || (f.bilgi && f.bilgi.trim()));
  const norm = f=> String((f && f.ad) || '').trim();
  let satirlar;
  if (ad === '*'){
    satirlar = hepsi;
  } else if (Array.isArray(ad)){
    const secili = ad.map(x=> String(x || '').trim());
    satirlar = hepsi.filter(f=> secili.includes(norm(f)));
  } else if (ad && String(ad).trim()){
    const tek = String(ad).trim();
    satirlar = hepsi.filter(f=> norm(f) === tek);
  } else {
    satirlar = hepsi.filter(f=> !norm(f));
  }
  if (!satirlar.length) return '';
  return `<div class="fsinfo"><span class="lbl">${baslik||'Fansublar'}</span><div>` +
    satirlar.map(f=>{
      const a = norm(f);
      return a ? `<div><b>${esc(f.ad)}</b>${f.bilgi?` — ${esc(f.bilgi)}`:''}</div>`
               : `<div>${esc(f.bilgi)}</div>`;
    }).join('') +
    `</div></div>`;
}
function fansubBilgi(ep, ad){
  const fs = Array.isArray(ep && ep.fansubs) ? ep.fansubs : [];
  const f = ad ? fs.find(x=> x.ad===ad) : fs.find(x=> !x.ad);
  return f && f.bilgi ? f.bilgi : '';
}

/* ============ iframe dönüşümü ============ */
function cleanRawUrl(u){
  let s = String(u||'').trim();
  const h = s.indexOf('href.li/?'); if (h!==-1) s = s.slice(h+9);
  if (s.startsWith('https:https://')) s = s.slice(6);
  return s;
}
const BAD_SCHEME = /^\s*(javascript|data|vbscript|file):/i;
function embedUrl(raw, tip){
  if (tip!=='url') return null;               // mask/yol: gömülemez
  const s = cleanRawUrl(raw);
  if (!/^https?:\/\//i.test(s)) return BAD_SCHEME.test(s) ? null : s;     // garip form: ham döndür (tehlikeli şema hariç)
  try{
    const u = new URL(s);
    const host = u.hostname.replace(/^www\./,'');
    const p = u.pathname;
    if (host==='drive.google.com'){
      const m = p.match(/^\/file\/d\/([^/]+)/);
      if (m && !p.endsWith('/preview')) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
      return s;
    }
    if (host==='dailymotion.com' || host==='dai.ly'){
      const m = p.match(/^\/(?:video|embed\/video)\/([a-z0-9]+)/i);
      if (m) return 'https://www.dailymotion.com/embed/video/'+m[1];
      return s;
    }
    if (host==='vk.com'){
      if (p.startsWith('/video_ext.php')) return s;
      const m = p.match(/^\/video(-?\d+)_(\d+)/);
      if (m) return 'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2];
      return s;
    }
    if (host==='sendvid.com'){
      const m = p.match(/^\/(?:v|embed)\/([a-z0-9]+)/i) || p.match(/^\/([a-z0-9]+)$/i);
      if (m) return 'https://sendvid.com/embed/'+m[1];
      return s;
    }
    if (host==='ok.ru' || host==='odnoklassniki.ru'){
      const m = p.match(/^\/video(?:embed)?\/(\d+)/);
      if (m) return 'https://odnoklassniki.ru/videoembed/'+m[1];
      return s;
    }
    /* SIBNET (shell.php), MP4UPLOAD (embed-*.html), VOE (/e/), DOOD (/e/),
       MAIL.RU (video/embed), UQLOAD/HDVID/VUDEO/MVIDOO/VTUBE/STREAMSB (embed-*.html),
       FILEMOON/EMBEDO/HIGHLOAD/TUBELOAD (/e/), EMBEDGRAM (/v/), SAVEFILEWAY, CLONE... */
    return s;
  }catch(e){ return s; }
}
function srcLink(raw, tip){
  const s = cleanRawUrl(raw||'');
  if (tip==='url' && /^https?:\/\//i.test(s)) return s;
  if (s.startsWith('/')) return 'https://www.turkanime.net'+s;
  return (s && !BAD_SCHEME.test(s)) ? s : null;
}

/* ============ M1: veri yükleme (JSONP — file:// dahil her yerde çalışır) ============ */
function loadAnime(slug){
  if (dataCache.has(slug)) return dataCache.get(slug);
  const pr = new Promise((resolve,reject)=>{
    if (window.__TKA__ && Object.prototype.hasOwnProperty.call(window.__TKA__, slug)){
      resolve(window.__TKA__[slug]); return;
    }
    const s = document.createElement('script');
    const temizle = ()=>{ clearTimeout(to); if (s.parentNode) s.parentNode.removeChild(s); };
    const to = setTimeout(()=>{ temizle(); reject(new Error('zaman aşımı (b/'+slug+'.js)')); }, 30000);
    s.onerror = ()=>{ temizle(); reject(new Error('b/'+encodeURIComponent(slug)+'.js yüklenemedi')); };
    s.onload = ()=>{
      if (window.__TKA__ && Object.prototype.hasOwnProperty.call(window.__TKA__, slug)){
        const d = window.__TKA__[slug];
        if (Array.isArray(d)){
          resolve(d);
          try{ delete window.__TKA__[slug]; }catch(e){}
        } else reject(new Error('b/'+encodeURIComponent(slug)+'.js bozuk veri'));   // PR1: bozuk dosya çökmesin
      } else reject(new Error('b/'+encodeURIComponent(slug)+'.js boş/hatalı'));
    };
    s.src = 'b/'+encodeURIComponent(slug)+'.js';
    document.head.appendChild(s);
  });
  dataCache.set(slug, pr);
  pr.catch(()=> dataCache.delete(slug));
  return pr;
}

/* ============ M6: indirme betiği üretimi ============ */
function fsSafe(s){ return String(s||'').replace(/[\\/:*?"<>|`$!\x00-\x1f]/g,'_'); }
/* URL'yi çift tırnak içinde güvenle kullanmak için: " ` $ \ ! boşluk ve kontrol karakterlerini %XX yap */
function safeArg(u){ return String(u||'').replace(/[\x00-\x20"`$\\!]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0')); }
function bolumBase(ep){ return ep.no!=null ? String(ep.no)+'. Bolum' : fsSafe(ep.slug); }
function firstUrlLink(ep){
  return kaldirilanFiltre(ep.links).filter(l=> l.tip==='url')[0] || null;
}
function ytCmd(url, outName){ return 'yt-dlp "'+safeArg(url)+'" -o "'+fsSafe(outName)+'"'; }
function buildIndirScripts(slug, data, tumu){
  const rows = data.map(ep=>({ep, links: kaldirilanFiltre(ep.links).filter(l=>l.tip==='url')}))
                   .filter(x=> x.links.length);
  const b = ['@echo off','chcp 65001 >nul','rem TurkAnime Arsiv - '+slug,
             'rem yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp',
             'rem kaldirilan linkler bu betikte yok','cd /d "%~dp0"',''];
  const s = ['#!/usr/bin/env bash','# TurkAnime Arsiv - '+slug,
             '# yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp','# set -e',''];
  for (const {ep, links} of rows){
    const base = bolumBase(ep);
    const kullan = tumu ? links : [firstUrlLink(ep)];
    kullan.forEach((l,i)=>{
      let nm = base;
      if (tumu && i>0) nm = base+' ('+fsSafe(l.player)+')';
      const u = safeArg(l.url);
      const urlB = u.replace(/%/g,'%%');   // bat %% kuralı
      b.push('yt-dlp "'+urlB+'" -o "'+nm+'.mp4"');
      s.push('yt-dlp "'+u+'" -o "'+nm+'.mp4"');
    });
  }
  b.push('','pause');
  return { bat: b.join('\r\n')+'\r\n', sh: s.join('\n')+'\n' };
}
function indirFile(name, content, mime){
  const blob = new Blob([content], {type: mime||'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---- tek link indirme betiği (.bat/.sh) — M2: player'daki "Videoyu indir" butonu ----
   Link seçimi: kaldirilan hariç + yönetici eklemeleri dahil; ilk uygun. */

/* Windows UA → .bat (CRLF), diğerleri → .sh (LF); blob ile indirilir. */
function linkIndirScript(slug, ad, url, batMi){
  if (!url) return null;
  const u = safeArg(url);
  const nm = fsSafe(ad);
  const satir = 'yt-dlp "'+(batMi ? u.replace(/%/g,'%%') : u)+'" -o "'+nm+'.mp4"';
  if (!batMi){
    return ('#!/usr/bin/env bash\n'
      + '# TurkAnime Arsiv - '+slug+' - '+nm+'\n'
      + '# yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp\nset -e\n'
      + satir + '\n');
  }
  return ('@echo off\r\nchcp 65001 >nul\r\n'
    + 'rem TurkAnime Arsiv - '+slug+' - '+nm+'\r\n'
    + 'rem yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp\r\n'
    + 'cd /d "%~dp0"\r\n' + satir + '\r\npause\r\n');
}
function linkIndirYap(btn, slug, ad, url, restore){
  const winMi = /windows/i.test(String(navigator.userAgent||''));   // Windows UA → .bat, diğerleri → .sh
  const icerik = linkIndirScript(slug, ad, url, winMi);
  if (!icerik){ flashDone(btn, 'indirilebilir url yok', 1600, restore); return; }
  indirFile('indir-'+slug+'-'+fsSafe(ad)+(winMi?'.bat':'.sh'), icerik,
            winMi ? 'text/plain;charset=utf-8' : 'text/x-shellscript;charset=utf-8');

}

const PAGE = 60;

function searchAnime(q){
  const nq = norm(q);
  if (!nq) return [];
  const toks = nq.split(' ').filter(Boolean);
  const scored = [];
  for (const a of ANIME){
    let score = 0, ok = true;
    for (const t of toks){
      if (a.nTok.has(t)) continue;                                  // tam kelime
      let pre = false;
      for (const w of a.tokArr){ if (w.startsWith(t)){ pre = true; break; } }
      if (pre){ score += 1; continue; }                             // kelime başı: "mon" → monogatari
      if (t.length>=3 && a.hay.includes(t)){ score += 2; continue; } // kelime ortası
      ok = false; break;
    }
    if (ok) scored.push({a, score});
  }
  scored.sort((x,y)=>{
    const px = x.a.nTitle.startsWith(nq)?0:1, py = y.a.nTitle.startsWith(nq)?0:1;
    if (px!==py) return px-py;
    if (x.score!==y.score) return x.score-y.score;
    return x.a.nTitle < y.a.nTitle ? -1 : x.a.nTitle > y.a.nTitle ? 1 : 0;
  });
  return scored.map(x=>x.a);
}

/* ============ poster kartları (Kerim tasarımı: ton gradyanı + baş harfler) ============ */
const HUES = [178,205,232,268,318,350,18,42,96,150];
function hueOf(s){ let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return HUES[h%HUES.length]; }
function initials(t){
  const w = String(t||'?').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);
  return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase();
}
function poster(a){
  const h = hueOf(a.slug), t = a.baslik||a.slug;
  return `<div class="poster" style="--h:${h};--g:${(h+35)%360}"><span class="pl">${esc(initials(t))}</span>${a.eps!=null?`<span class="pn">${a.eps} bölüm</span>`:''}${alPosterImg(a)}</div>`;
}
function card(a){
  const bos = (a.urls||0) + (a.masks||0) === 0;
  const urlYok = !bos && (a.urls||0) === 0;
  const isaret = bos ? `<span class="nolk big" title="bu seride hiç oynatılabilir link kalmadı">${ic('ban')} link yok</span>`
              : urlYok ? `<span class="nolk" title="oynatılabilir url linki kalmadı (yalnız site içi player)">${ic('ban')} url yok</span>` : '';
  return `<a class="card" href="#/anime/${encodeURIComponent(a.slug)}">${poster(a)}<span class="ct">${esc(a.baslik||a.slug)}</span><span class="cs">${esc((a.top||[]).slice(0,2).join(', ')||'kaynak yok')}</span>${isaret}</a>`;
}

/* ============ AniList zenginleştirme (PR1'den alındı) ============
   Kapak + tür + puan + özet. İstemci tarafında YALNIZCA sabit
   https://graphql.anilist.co uç noktasına sorgu gider; sonuç
   localStorage'da önbelleklenir. file:// / çevrimdışı / bulunamadı
   durumlarında hiçbir şey bozulmaz: mevcut gradyan-poster görünümü kalır. */
const AL = {
  ENDPOINT: 'https://graphql.anilist.co',
  QUERY: 'query($s:String){Page(perPage:4){media(search:$s,type:ANIME,sort:SEARCH_MATCH){title{romaji english}coverImage{extraLarge large}averageScore seasonYear genres description(asHtml:false)}}}',
  OK_TTL: 14*864e5, NO_TTL: 3*864e5, DESC_UZUN: 300, KEY: 'tk_anilist_v1'
};
/* M4: anilist.js toplu veri — turkanime_anilist_topla.py üretir; JSONP olduğu için
   file:// dâhil her yerde yüklenir (fetch/CORS derdi yok). Eşleşmeyen slug'larda
   davranış eski hâliyle kalır: localStorage önbelleği + istemci-fetch fallback. */
function alToplu(slug){
  const t = window.__ANILIST__;
  if (!t || !Object.prototype.hasOwnProperty.call(t, slug)) return null;
  const e = t[slug] || {};
  return {
    b: e.banner || '',
    c: e.cover || '',
    s: e.score || 0,
    y: e.year || 0,
    g: (e.genres || []).slice(0, 4),
    d: String(e.desc || '').slice(0, AL.DESC_UZUN)
  };
}
function alBanner(slug){   // varsa banner, yoksa kapak — hero arka planı için
  const d = alToplu(slug);
  return d ? (d.b || d.c || '') : '';
}
let _alMem = null, _alPend = new Map(), _alSaveT = 0;
function alStore(){
  if (_alMem) return _alMem;
  try{ _alMem = JSON.parse(localStorage.getItem(AL.KEY)||'{}'); if (!_alMem || !_alMem.s) _alMem = {s:{}}; }
  catch(e){ _alMem = {s:{}}; }
  return _alMem;
}
function alKaydet(){
  if (_alSaveT) return;
  _alSaveT = setTimeout(()=>{
    _alSaveT = 0;
    try{ localStorage.setItem(AL.KEY, JSON.stringify(alStore())); }
    catch(e){   // kota doldu → en eski kayıtların %25'ini at, bir kez daha dene
      try{
        const s = alStore().s, tus = Object.keys(s).sort((a,b)=>(s[a].t||0)-(s[b].t||0));
        tus.slice(0, Math.ceil(tus.length*0.25)).forEach(k=>{ delete s[k]; });
        localStorage.setItem(AL.KEY, JSON.stringify(alStore()));
      }catch(_){}
    }
  }, 400);
}
function alKayit(slug){   // → {t, d|n} | null (sorgulanmalı)
  const k = alStore().s[slug];
  if (!k) return null;
  return (Date.now() - (k.t||0)) < (k.n ? AL.NO_TTL : AL.OK_TTL) ? k : null;
}
function alAyarla(slug, kayit){
  alStore().s[slug] = kayit; alKaydet();
}
function alSec(ms, baslik){   // sonuçlar içinden başlığa en yakın medyayı seç
  const h = norm(baslik);
  let best = ms[0], skor = -1;
  for (const x of ms){
    const adlar = [x.title&&x.title.romaji, x.title&&x.title.english].filter(Boolean).map(norm);
    const s = adlar.length ? Math.max(...adlar.map(a=> a===h ? 3 : (a && h && (a.startsWith(h)||h.startsWith(a))) ? 2 : 0)) : 0;
    if (s > skor){ skor = s; best = x; }
  }
  return best;
}
async function alCek(slug, baslik){
  if (_alPend.has(slug)) return _alPend.get(slug);
  const pr = (async()=>{
    const r = await fetch(AL.ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({query: AL.QUERY, variables:{s:String(baslik||'').slice(0,120)}})
    });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    const ms = (j && j.data && j.data.Page && j.data.Page.media) || [];
    if (!ms.length){ alAyarla(slug, {t:Date.now(), n:1}); return null; }   // bulunamadı → bir daha denenmesin
    const m = alSec(ms, baslik);
    const d = {
      c: (m.coverImage && (m.coverImage.extraLarge || m.coverImage.large)) || '',
      s: m.averageScore||0, y: m.seasonYear||0,
      g: (m.genres||[]).slice(0,4),
      d: String(m.description||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim().slice(0, AL.DESC_UZUN)
    };
    alAyarla(slug, {t:Date.now(), d});
    return d;
  })();
  _alPend.set(slug, pr);
  const temizle = ()=> _alPend.delete(slug);
  pr.then(temizle, temizle);
  pr.catch(()=>{});   // hata sessizce düşer (çağıranın await'i ayrı)
  return pr;
}
function alPosterImg(a){   // önbellekte/toplu veride kapak varsa poster'e <img> ekler (yoksa boş)
  const t = alToplu(a.slug);
  const c = t ? t.c : ((alKayit(a.slug)||{}).d||{}).c;
  return c ? `<img src="${esc(c)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('on')" onerror="this.remove()">` : '';
}
function alKapakEkle(kok, d){   // mevcut poster kutusuna kapak görseli yerleştirir
  if (!kok || !d || !d.c || kok.querySelector('img')) return;
  const img = document.createElement('img');
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
  img.onload = ()=> img.classList.add('on');
  img.src = d.c;
  kok.appendChild(img);
}
async function alZenginlestir(slug, meta){
  /* M4: önce anilist.js (anında, ağ yok) → sonra önbellek → en son istemci-fetch */
  let d = alToplu(slug);
  if (!d){
    const k = alKayit(slug);
    if (k && k.d) d = k.d;
    else if (k && k.n) return;   // önceden bulunamadı — sessiz geç
    else { try{ d = await alCek(slug, (meta && meta.baslik) || slug); }catch(e){ return; } }
    if (!d) return;              // AniList'te bulunamadı — sessiz geç (PR1 düzeltmesi: null çökmesi) 
  }
  const beklenen = '#/anime/' + encodeURIComponent(slug);
  const h = location.hash || '';
  if (h !== beklenen && h.indexOf(beklenen+'/') !== 0) return;   // kullanıcı başka sayfaya geçti
  alKapakEkle(document.querySelector('.aposter .poster'), d);
  const at = document.querySelector('.atxt');
  if (at && !at.querySelector('.ainfo')){
    const c = [];
    if (d.s) c.push(`<span class="gchip" title="AniList puanı">${ic('star')} ${(d.s/10).toFixed(1)}</span>`);
    if (d.y) c.push(`<span class="gchip">${d.y}</span>`);
    (d.g||[]).forEach(g=> c.push(`<span class="gchip">${esc(g)}</span>`));
    const syn = d.d && d.d.length > 420 ? d.d.slice(0,417)+'…' : d.d;
    const el = document.createElement('div');
    el.className = 'ainfo';
    el.innerHTML = `${c.length?`<div class="gchips">${c.join('')}</div>`:''}${syn?`<p class="syn">${esc(syn)}<small>Özet: AniList</small></p>`:''}`;
    at.appendChild(el);
  }
}
let _landingD = null;
function alOneriKapak(){   // ana sayfa "günün önerisi" kapak + gerçek banner zenginleştirmesi
  const a = _landingD;
  if (!a || !a.slug) return;
  const uygula = d=> alKapakEkle(document.querySelector('.fposter .poster'), d);

    return;
  }
  const k = alKayit(a.slug);
  if (k) return uygula(k.d);
  alCek(a.slug, a.baslik).then(uygula).catch(()=>{});
}

/* ============ ana sayfa bileşenleri: günün önerisi, kategoriler, harf ============ */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pickSome(pool, n, seed){ const r=rng(seed), p=pool.slice(); for (let i=p.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } return p.slice(0,n); }
const dayKey = ()=>{ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };

/* ============ bağlantılı seriler (OVA / film / diğer sezonlar) ============ */
const REL_DROP = new Set(['season','seasons','1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th',
  'final','part','cour','movie','movies','film','the','animation','ova','ona','tv','special','specials',
  'recap','recaps','picture','drama','edition','memorial','hen','gaiden','omake','shorts','short','mini','ii','iii','iv']);
function relKey(slug){
  const t = String(slug||'').split('-');
  while (t.length>1 && (REL_DROP.has(t[t.length-1]) || /^\d+$/.test(t[t.length-1]))) t.pop();
  return t.join('-');
}
function relTag(a){
  const s = (String(a.slug)+' '+String(a.baslik||'')).toLowerCase();
  if (/final[- ]season|saishuushou|saishuu-shou/.test(s)) return 'Final';
  let m = s.match(/(\d+)(?:st|nd|rd|th)[- ]season/) || s.match(/season[- ](\d+)/) || s.match(/[- ](\d+)(?:st|nd|rd|th)[- ]/);
  if (m) return m[1]+'. Sezon';
  if (/\b(movie|film)\b/.test(s)) return 'Film';
  if (/\bova\b/.test(s)) return 'OVA';
  if (/\bona\b/.test(s)) return 'ONA';
  if (/special/.test(s)) return 'Özel';
  if (/recap|soush?uuhen/.test(s)) return 'Özet';
  if (/\bpart[- ](\d+)\b/.test(s)) return 'Part '+RegExp.$1;
  return null;
}
const REL_SEQ = /^(?:\d+|2nd|3rd|4th|5th|6th|7th|8th|9th|10th|season|seasons|final|part|cour|movie|movies|film|ova|ona|special|specials|recap|recaps|tv|the|gaiden|hen|ii|iii|iv|v)$/;
function relSeq(uzun, kisa){
  if (!uzun.startsWith(kisa+'-')) return false;
  return REL_SEQ.test(uzun.slice(kisa.length+1).split('-')[0]);
}
function relatedOf(slug){
  const key = relKey(slug);
  if (!key || key.length < 2) return [];
  const genis = key.indexOf('-')!==-1 || key.length >= 6;
  const out = [];
  for (const a of ANIME){
    if (a.slug === slug) continue;
    const k2 = relKey(a.slug);
    const ayni = k2===key
      || (genis && a.slug.startsWith(key+'-'))
      || (k2.length>=6 && k2.indexOf('-')!==-1 && slug.startsWith(k2+'-'))
      || relSeq(a.slug, slug) || relSeq(slug, a.slug);
    if (ayni) out.push(a);
  }
  out.sort((a,b)=> String(a.slug).localeCompare(String(b.slug),'tr'));
  return out.slice(0, 18);
}
function relCard(a){
  const tag = relTag(a);
  return `<a class="card rel-card" href="#/anime/${encodeURIComponent(a.slug)}">
    ${tag?`<span class="rel-tag">${esc(tag)}</span>`:''}
    ${poster(a)}<span class="ct">${esc(a.baslik||a.slug)}</span>
    <span class="cs">${esc(a.eps?a.eps+' bölüm':'bölüm yok')}</span></a>`;
}
function relatedHtml(slug){
  const rel = relatedOf(slug);
  if (!rel.length) return '';
  return `<div class="sh"><h2>Bağlantılı seriler</h2><span style="color:var(--tx3);font-size:12.5px">${rel.length} seri</span></div>
    <div class="rail">${rel.map(relCard).join('')}</div>`;
}

  appEl().querySelectorAll('.fchip[data-dim]').forEach(b=>{

  appEl().querySelectorAll('.opt').forEach(el=>{

/* ============ oynatıcı görünümü (sol oynatıcı + sağ bölüm listesi) ============ */
/* KAYNAK çipleri: bölümün gömülebilir (tip=url) linkleri — kaldirilan hariç, eklenen dahil.
   Sıra: player (tr) → fansub (tr). Varsayılan seçim: ilk kaynak. */
let plySelFansubs = new Set();   // player sayfası fansub filtresi (bölüm başına sıfırlanır)
let plyKey = '';
function kaynakSira(kay){
  return kay.slice().sort((a,b)=>{
    const pc = String(a.l.player).localeCompare(String(b.l.player),'tr');
    if (pc!==0) return pc;
    return String(a.l.fansub).localeCompare(String(b.l.fansub),'tr');
  });
}
function enIyiKaynak(kay){
  return kay[0] || null;
}
function fsAbbr(f){
  const s = String(f||'').trim();
  if (!s) return '';
  if (s.length<=4) return s.toUpperCase();
  const w = s.split(/[\s\-_.]+/).filter(Boolean);
  if (w.length>1) return w.map(x=>x[0]).join('').toUpperCase();
  return s.slice(0,3).toUpperCase();
}
function renderPlayer(slug, data, bolumId, playerName, idxStr){
  const ep = findEp(data, bolumId);
  if (!ep){ appEl().innerHTML = `<div class="errbox">Bölüm bulunamadı: ${esc(bolumId)}</div>`; return; }

  const okey = slug+'|'+bolumId;
  if (plyKey !== okey){ plyKey = okey; plySelFansubs = new Set(); }
  const num = ep.no!=null?String(ep.no):ep.slug;
  const cmd = `turkanime_ara.py ${slug} --bolum ${num}`;
  /* tüm görünür linkler (kaldirilan hariç + eklenen) */
  const kaldi = kaldirilanSet();
  const tumLinks = [];
  (ep.links||[]).forEach((l,i)=>{ if (!kaldi.has(l.url)) tumLinks.push({l,i}); });
  eklenenLinkler(slug, ep).forEach((l,k)=> tumLinks.push({l, i: EKLENEN_I_BASE + k}));
  const gorunur = tumLinks;
  const optN = gorunur.length;
  const maskSay = gorunur.filter(x=> x.l.tip!=='url').length;
  const kayHepsi = kaynakSira(gorunur.filter(x=> x.l.tip==='url'));
  /* fansub filtresi (kesişim): KAYNAK çiplerini süzer */
  const fCount = new Map();
  for (const x of kayHepsi) if (x.l.fansub) fCount.set(x.l.fansub, (fCount.get(x.l.fansub)||0)+1);
  const kay = kayHepsi.filter(x=> !plySelFansubs.size || plySelFansubs.has(x.l.fansub));
  /* seçili kaynak: adresli gelen (eski konum-uyumu dahil) ya da en iyi görünür */
  let cur = null;
  if (playerName!=null){
    let pName; try{ pName = decodeURIComponent(playerName); }catch(e){ pName = playerName; }
    const idxRaw = parseInt(idxStr||'0',10)||0;
    cur = kay.find(x=> x.i===idxRaw && x.l.player===pName) || null;
    if (!cur){
      const cands = kay.filter(x=> x.l.player===pName);

  if (!cur){

      ? `Bu bölümde gömülebilir (url) kaynak yok.${maskSay?' Site içi player linkleri seçenekler listesinde.':''}`
      : `Bu bölümün oynatılabilir kaynağı kalmadı.${(ep.links||[]).length && maskSay===0?' Tüm linkler silinmiş/kaldırılmış olabilir.':''}`;

    return;
  }
  const pNameCur = cur.l.player;

  const fansubRow = fCount.size>1 ? `<div class="chiprow"><span class="lbl">Fansub</span>` +

    (plySelFansubs.size?`<button class="fchip temizle" data-fstemizle="1" type="button">✕ temizle</button>`:'') + `</div>` : '';
  /* KAYNAK çip satırı */

  const dlGrp = isHttpUrl ? `

      </span>` : '';
  appEl().innerHTML = `

    <div class="watch">

        <div class="note-soft">Player açılmadıysa (üçüncü parti host engelleyebilir) <b>kaynak linkini</b> kullan ya da yt-dlp komutuyla indir.</div>
        ${kaynakRow}
      </div>
      ${epSideHtml(slug, data, ep)}
      <div class="watch-bot">
        <div class="pmeta">
          <span class="pname">${esc(pNameCur)}</span>
          ${cur.l.eklenen?`<span class="tag eklenen" title="yönetici eklemesi (eklenen.js)">yeni</span>`:''}
          <span class="tag ${tipClass(cur.l.tip)}">${esc(cur.l.tip)}</span>
          ${cur.l.fansub?`<span>${esc(cur.l.fansub)}</span>`
            :`<span style="opacity:.55;font-style:italic" title="Bu linkin fansubu veritabanında belli değil">(belirsiz)</span>`}
        </div>
        ${fansubBilgiHtml(ep, cur.l.fansub || '', cur.l.fansub ? 'Fansub' : 'Fansublar')}
        ${rawUrl?`<div class="src"><button class="btn sm" id="videoIndir" type="button" title="seçili kaynak için tek satırlık yt-dlp betiği indir (Windows → .bat, diğer → .sh)">${ic('dl')} Videoyu indir</button>

/* ============ geri bildirim (buton "done" durumu — ikonu korur) ============ */
function flashDone(btn, txt, ms, restore){
  const old = restore!=null ? restore : btn.innerHTML;
  btn.classList.add('done');
  btn.innerHTML = ic('check')+(txt?' '+esc(txt):'');
  setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = old; }, ms||1400);
}
function pagerHTML(page, total, perPage){
  const PP = perPage || PAGE;
  const pages = Math.max(1, Math.ceil(total/PP));
  if (pages<=1) return '';
  const btns = [];
  const win = [];
  for (let i=1;i<=pages;i++){
    if (i<=2 || i>pages-2 || Math.abs(i-page)<=2) win.push(i);
  }
  let prev=0;
  for (const i of win){
    if (prev && i-prev>1) btns.push('<span class="dots">…</span>');
    btns.push(`<button class="${i===page?'on':''}" data-pg="${i}">${i}</button>`);
    prev=i;
  }
  return `<div class="pager">
    <button data-pg="${Math.max(1,page-1)}" ${page<=1?'disabled':''}>‹</button>
    ${btns.join('')}
    <button data-pg="${Math.min(pages,page+1)}" ${page>=pages?'disabled':''}>›</button>
  </div>`;
}
/* ============ anime sayfası ============ */

function bolumIdFor(ep){ return ep.no!=null ? String(ep.no) : encodeURIComponent(ep.slug); }

/* ============ bölüm seçenekleri ============ */
let optSelPlayers = new Set();
let optSelFansubs = new Set();
let optKey = '';

function tipClass(t){ return t==='url'?'url':t==='mask'?'mask':'diger'; }

function findEp(data, bolumId){
  if (/^\d+$/.test(bolumId)){
    const e = data.find(x=>String(x.no)===bolumId);
    if (e) return e;
  }
  let bs = null;
  try { bs = decodeURIComponent(bolumId); } catch(e){ bs = bolumId; }
  return data.find(x=>x.slug===bs || encodeURIComponent(x.slug)===bolumId);
}

function optionsFor(ep){
  return (ep.links||[])
    .map((l,i)=>({l,i}))
    .sort((a,b)=>{
      const au=a.l.tip==='url'?0:1, bu=b.l.tip==='url'?0:1;
      if (au!==bu) return au-bu;
      const pc = String(a.l.player).localeCompare(String(b.l.player),'tr');
      if (pc!==0) return pc;
      return String(a.l.fansub).localeCompare(String(b.l.fansub),'tr');
    });
}

function chipRowHtml(lbl, counts, sel, dim){
  const items = [...counts.entries()]

  return `<div class="chiprow"><span class="lbl">${lbl}</span>` +

    (sel.size?`<button class="fchip temizle" data-temizle="${dim}">✕ temizle</button>`:'') +

async function copyText(txt){
  /* clipboard API bazı ortamlarda (headless/odak dışı) takılabilir →
     kısa süre aşımıyla yarıştır, gerekirse execCommand yedeğine düş */
  try{
    const ok = await Promise.race([
      navigator.clipboard.writeText(txt).then(()=>true),
      new Promise(r=>setTimeout(()=>r(false), 700))
    ]);
    if (ok) return true;
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    ta.remove(); return true;
  }catch(e){ return false; }
}
function bindCopy(){
  document.querySelectorAll('.copybtn').forEach(b=>{
    if (b.dataset.act) return;   // "çöz" gibi özel butonlar ayrı bağlanır
    b.onclick = ()=> copyText(b.dataset.cmd).then(()=> flashDone(b,'kopyalandı ✓'));
  });
}

/* ============ router ============ */
let routeToken = 0;

function showLoading(msg){
  appEl().innerHTML = `<div class="loading"><div class="spinner"></div><div>${esc(msg||'Yükleniyor...')}</div></div>`;
}

function navAktif(){
  /* M1: üst bar nav aktif bağlantısı */
  const h = location.hash||'';
  const sec = (h.startsWith('#/animeler') || h.startsWith('#/anime/')) ? 'animeler'
            : h.startsWith('#/kategoriler') ? 'kategoriler' : 'ana';
  document.querySelectorAll('.topnav a').forEach(a=> a.classList.toggle('on', a.dataset.nav===sec));
}

function route(){
  const tok = ++routeToken;
  const h = location.hash||'';
  document.title = 'TürkAnime Arşiv — İzle';
  navAktif();
  if (!h || h==='#' || h==='#/' || h.startsWith('#/ara')){
    renderHome();
    if (lastQuery) $('#q').value = lastQuery;
    return;
  }
  if (h.startsWith('#/animeler')){ renderAnimeler(); return; }        // M3
  if (h.startsWith('#/kategoriler')){ renderKategoriler(); return; }  // M3
  const m = h.match(/^#\/anime\/([^/]+)(?:\/([^/]+))?(?:\/([^/]+))?(?:\/([^/]+))?/);
  if (!m){ location.hash = '#/ara'; return; }
  const slug = decodeURIComponent(m[1]);
  const bolumId = m[2], player = m[3], idx = m[4];
  showLoading('Bölümler yükleniyor...');
  loadAnime(slug).then(data=>{
    if (tok!==routeToken) return;
    if (!Array.isArray(data)){
      appEl().innerHTML = `<div class="errbox"><b>${esc(slug)}</b> için veri bulunamadı (b/${esc(slug)}.js bozuk).<br><a href="#/ara">Aramaya dön</a></div>`;
      return;
    }
    if (bolumId && player==='liste') renderOptions(slug, data, bolumId);       // yönetim/seçenek listesi
    else if (bolumId && player) renderPlayer(slug, data, bolumId, player, idx);
    else if (bolumId) renderPlayer(slug, data, bolumId, null, null);           // bölüm → doğrudan player
    else { epPage = 1; renderAnime(slug, data); }
  }).catch(err=>{
    if (tok!==routeToken) return;
    appEl().innerHTML = `<div class="errbox"><b>${esc(slug)}</b> için veri bulunamadı: ${esc(err.message)}<br>b/${esc(slug)}.js dosyası siteyle aynı klasörde olmalı.<br><a href="#/ara">Aramaya dön</a></div>`;
  });
}

/* ============ arama girişi ============ */
const qEl = document.getElementById('q');
qEl.addEventListener('input', debounce(()=>{
  lastQuery = qEl.value.trim();
  lastPage = 1;
  const h = location.hash||'';
  if (!h || h==='#' || h==='#/' || h.startsWith('#/ara')) renderHome();
  else if (lastQuery) location.hash = '#/ara';
}, 150));
document.addEventListener('keydown', e=>{
  if (e.key==='/' && document.activeElement!==qEl && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); qEl.focus();
  }
});

/* ============ boot ============ */
if (ADMIN){ const b = document.getElementById('admBadge'); if (b) b.hidden = false; }
window.addEventListener('hashchange', route);
route();
pingServer();  // M7b: yardımcı sunucu varsa "çöz" butonları görünür olur

/* ============ rastgele anime + mobil alt menü ============ */
document.querySelectorAll('.rnd').forEach(b=>{
  b.onclick = ()=>{ const a = ANIME[Math.floor(Math.random()*ANIME.length)]; location.hash = '#/anime/'+encodeURIComponent(a.slug); };
});
const bSearchBtn = document.getElementById('bSearch');
if (bSearchBtn) bSearchBtn.onclick = ()=>{ window.scrollTo(0,0); qEl.focus(); };
</script>
</body>
</html>
