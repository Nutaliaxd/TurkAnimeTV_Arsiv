<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TürkAnime Arşiv — İzle</title>
<style>
:root{
  --bg:#0b0f17; --bg2:#101725; --card:#141c2d; --card2:#1a2438; --line:#233049;
  --tx:#e7edf7; --tx2:#93a3bd; --tx3:#5c6c88;
  --ac:#7c5cff; --ac2:#22d3ee; --ok:#2dd481; --bad:#ff5c6c; --warn:#ffc94d;
  --rad:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--ac2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:50;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1000px;margin:0 auto}
.logo{font-weight:800;font-size:19px;letter-spacing:.3px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;cursor:pointer}
.searchbox{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.searchbox:focus-within{border-color:var(--ac)}
.searchbox svg{flex:none;opacity:.5}
#q{flex:1;background:none;border:none;outline:none;padding:9px 10px;font-size:15px}
#q::placeholder{color:var(--tx3)}
.kbd{flex:none;font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
main{padding:20px 0 60px}
.crumb{color:var(--tx2);font-size:13px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb .sep{color:var(--tx3)}
.crumb a{color:var(--tx2)}
.crumb a:hover{color:var(--ac2)}
h1.anime-title{font-size:24px;font-weight:800;line-height:1.25;margin-bottom:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--tx2)}
.stat b{color:var(--tx)}
.players-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{font-size:11.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.result{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:9px;cursor:pointer;transition:border-color .12s,transform .12s}
.result:hover{border-color:var(--ac);transform:translateX(3px)}
.result .rt{font-weight:700;font-size:15.5px}
.result .rs{font-size:12.5px;color:var(--tx2);margin-top:3px;display:flex;flex-wrap:wrap;gap:10px}
.result .go{color:var(--tx3);flex:none}
.ep{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;transition:border-color .12s}
.ep:hover{border-color:var(--ac)}
.ep .no{flex:none;min-width:52px;text-align:center;font-weight:800;font-size:13px;color:var(--ac2);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);border-radius:8px;padding:3px 8px}
.ep .ea{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .meta{flex:none;font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.n{background:#3a4a68}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:9px;cursor:pointer;transition:border-color .12s}
.opt:hover{border-color:var(--ac)}
.opt .pname{font-weight:800;font-size:15px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .fansub{color:var(--tx2);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:2px 7px;text-transform:uppercase;flex:none}
.tag.url{color:#7ee2ff;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3)}
.tag.mask{color:#c9b7ff;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.35)}
.tag.diger{color:var(--tx2);background:var(--card2);border:1px solid var(--line)}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;flex:none}
.badge.calisiyor{color:#0e2b1c;background:var(--ok)}
.badge.olu{color:#3b0b12;background:var(--bad)}
.badge.supheli{color:#332600;background:var(--warn)}
.badge.n{color:var(--tx2);background:var(--card2);border:1px solid var(--line)}
.player-box{background:#000;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.player-box iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.pmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 6px;font-size:13px;color:var(--tx2)}
.pmeta .pname{font-weight:800;font-size:16px;color:var(--tx)}
.src{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad)}
.src .lbl{color:var(--tx2);font-size:13px;flex:none}
.src a{word-break:break-all;font-size:13px}
.copybtn{margin-left:auto;flex:none;background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:6px 12px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;transition:all .12s}
.copybtn:hover{color:var(--ac2);border-color:var(--ac2)}
.copybtn.done{color:var(--ok);border-color:var(--ok)}
.fansub-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.fchip.on{border-color:var(--ac);color:var(--tx);background:rgba(124,92,255,.12)}
.note{background:rgba(255,201,77,.07);border:1px solid rgba(255,201,77,.3);color:#ffe2a0;border-radius:var(--rad);padding:12px 16px;font-size:13.5px;margin:12px 0}
.errbox{background:rgba(255,92,108,.08);border:1px solid rgba(255,92,108,.35);color:#ffb9c1;border-radius:var(--rad);padding:14px 16px;font-size:14px;margin:12px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--bad)}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:18px 0}
.pager button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--tx2)}
.pager button:hover{border-color:var(--ac);color:var(--tx)}
.pager button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}
.pager .dots{color:var(--tx3);padding:0 2px}
.jump{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0 0;font-size:13px;color:var(--tx2)}
.jump input{width:80px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none;text-align:center}
.jump input:focus{border-color:var(--ac)}
.jump button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--tx2)}
.count-line{color:var(--tx2);font-size:13px;margin:4px 0 14px}
.empty{padding:40px 20px;text-align:center;color:var(--tx2)}
.empty .big{font-size:40px;margin-bottom:10px}
.hero{text-align:center;padding:52px 10px 30px}
.hero h1{font-size:32px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--tx2);margin-top:8px;font-size:14.5px}
.hero .hint{margin-top:14px;font-size:12.5px;color:var(--tx3)}
.hero .hint kbd{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--tx2)}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note-soft{margin-top:8px;font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.note-soft b{color:var(--tx)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;align-items:center}
.chiprow .lbl{font-size:12px;color:var(--tx3);flex:none;min-width:66px;text-transform:uppercase;letter-spacing:.4px}
.fchip b{font-weight:800;color:var(--ac2);font-size:11.5px}
.fchip.on b{color:var(--tx)}
.fchip.temizle{border-style:dashed;color:var(--bad)}
.mini{flex:none;font-size:11px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);border-radius:7px;padding:3px 8px;transition:all .12s}
.mini:hover{color:var(--ac2);border-color:var(--ac2)}
.mini.x:hover{color:var(--bad);border-color:var(--bad)}
.mini.done{color:var(--ok);border-color:var(--ok)}
.mini[disabled]{opacity:.5;cursor:wait}
.optacts{margin-left:auto;flex:none;display:flex;gap:5px;align-items:center}
.opt .tag,.opt .badge{flex:none}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:700;display:inline-flex;gap:7px;align-items:center;transition:filter .12s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:var(--card2);color:var(--tx2);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{color:var(--ac2);border-color:var(--ac2);filter:none}
.btn.done{background:var(--ok)}
.src .grp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.src .grp .copybtn{margin-left:0}
.resolvebox{margin:10px 0;padding:12px 14px;background:var(--card);border:1px solid rgba(34,211,238,.35);border-radius:var(--rad);font-size:13px}
.resolvebox .rurl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0 0}
.resolvebox code{background:#000;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;color:var(--ac2);font-family:ui-monospace,Consolas,monospace;word-break:break-all;flex:1;min-width:200px}
@media (max-width:640px){
  .top-in{padding:8px 10px;gap:8px}
  .logo{font-size:16px}
  .kbd{display:none}
  .ep .meta{display:none}
  h1.anime-title{font-size:20px}
  .hero{padding:30px 6px 20px}
  .hero h1{font-size:24px}
  .opt .fansub{font-size:12px}
}
</style>
</head>

<script>
"use strict";
/* ============ yardımcılar ============ */
const $ = s => document.querySelector(s);
const appEl = () => document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TR_MAP = {'ı':'i','İ':'i','I':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c'};
function norm(s){
  let t = '';
  for (const ch of String(s)) t += TR_MAP[ch] || ch;
  return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ============ index hazırlığı ============ */
const ANIME = [];
(function buildIndex(){
  for (const row of window.INDEX){
    const slug=row[0], baslik=row[1], eps=row[2], urls=row[3], masks=row[4], top=row[5]||[];
    const n = norm(baslik);
    const nTok = new Set(n.split(' ').concat(norm(slug).split(' ')).filter(Boolean));
    ANIME.push({ slug, baslik, eps, urls, masks, top,
      nTitle: n, nTok, tokArr: [...nTok], hay: n+' '+norm(slug) });
  }
  ANIME.sort((a,b)=> a.nTitle < b.nTitle ? -1 : a.nTitle > b.nTitle ? 1 : 0);
})();

/* ============ durum ============ */
let _oluMem = false;   // localStorage kapalıysa (gizli mod vb.) oturum içinde bellekte tut
const oluGoster = {
  get:()=>{ try{ return localStorage.getItem('tk_olu')==='1'; }catch(e){ return _oluMem; } },
  set:v=>{ _oluMem = !!v; try{ localStorage.setItem('tk_olu', v?'1':'0'); }catch(e){} }
};
const dataCache = new Map();

/* ---- yönetici modu: × ve dışa aktarma sadece yerelde ya da ?admin=1 ile görünür ---- */
const ADMIN = (function(){
  try{
    const p = new URLSearchParams(location.search);
    if (p.get('admin')==='1') localStorage.setItem('tk_admin','1');
    if (p.get('admin')==='0') localStorage.removeItem('tk_admin');
    if (localStorage.getItem('tk_admin')==='1') return true;
  }catch(e){}
  return location.protocol==='file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
})();

/* ---- M2: kaldırılan linkler ----
   GLOBAL: repodaki kaldirilan.js (herkes için gizli, git ile yayınlanır)
   YEREL : bu tarayıcıda × ile kaldırılanlar (localStorage) — dışa aktarıp repoya eklenir */
const KLD_KEY = 'tk_kaldirilan';
const GLOBAL_KLD = new Set(Array.isArray(window.KALDIRILAN) ? window.KALDIRILAN : []);
let _yerelKld = null, _tumKld = null;
function yerelKaldirilanSet(){
  if (_yerelKld) return _yerelKld;
  try{ const a = JSON.parse(localStorage.getItem(KLD_KEY)||'[]'); _yerelKld = new Set(Array.isArray(a)?a:[]); }
  catch(e){ _yerelKld = new Set(); }
  return _yerelKld;
}
function kaldirilanSet(){
  if (!_tumKld) _tumKld = new Set([...GLOBAL_KLD, ...yerelKaldirilanSet()]);
  return _tumKld;
}
function linkKaldir(u){
  const s = yerelKaldirilanSet(); s.add(u);
  try{ localStorage.setItem(KLD_KEY, JSON.stringify([...s])); }catch(e){}
  _tumKld = null;
}
function bekleyenKaldirilan(){ return [...yerelKaldirilanSet()].filter(u=>!GLOBAL_KLD.has(u)); }
function kaldirilanSay(){ return bekleyenKaldirilan().length; }
function kaldirilanFiltre(links){ const k = kaldirilanSet(); return links.filter(l=>!k.has(l.url)); }

/* ---- M7b: yardımcı sunucu var mı? (ping) ---- */
let SERVER_OK = false;
function pingServer(){
  if (location.protocol === 'file:' || /\.github\.io$/i.test(location.hostname)) return;  // API yok, sorgulamadan atla
  try{
    fetch('api/ping').then(r=> r.ok ? r.json() : null).then(j=>{
      if (j && j.ok && !SERVER_OK){
        SERVER_OK = true;
        const h = location.hash||'';
        if (h.startsWith('#/anime/')) route();  // çöz butonlarını görünür kıl
      }
    }).catch(()=>{});
  }catch(e){}
}

const DURUM_LABEL = {calisiyor:'çalışıyor', olu:'ölü', supheli:'şüpheli'};
function badge(d){
  const k = d || 'n';
  const t = d ? (DURUM_LABEL[d]||d) : 'bilinmiyor';
  return `<span class="badge ${k}">${t}</span>`;
}
function dot(d){

/* ============ iframe dönüşümü ============ */
function cleanRawUrl(u){
  let s = String(u||'').trim();
  const h = s.indexOf('href.li/?'); if (h!==-1) s = s.slice(h+9);
  if (s.startsWith('https:https://')) s = s.slice(6);
  return s;
}
const BAD_SCHEME = /^\s*(javascript|data|vbscript|file):/i;
function embedUrl(raw, tip){
  if (tip!=='url') return null;               // mask/yol: gömülemez
  const s = cleanRawUrl(raw);
  if (!/^https?:\/\//i.test(s)) return BAD_SCHEME.test(s) ? null : s;     // garip form: ham döndür (tehlikeli şema hariç)
  try{
    const u = new URL(s);
    const host = u.hostname.replace(/^www\./,'');
    const p = u.pathname;
    if (host==='drive.google.com'){
      const m = p.match(/^\/file\/d\/([^/]+)/);
      if (m && !p.endsWith('/preview')) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
      return s;
    }
    if (host==='dailymotion.com' || host==='dai.ly'){
      const m = p.match(/^\/(?:video|embed\/video)\/([a-z0-9]+)/i);
      if (m) return 'https://www.dailymotion.com/embed/video/'+m[1];
      return s;
    }
    if (host==='vk.com'){
      if (p.startsWith('/video_ext.php')) return s;
      const m = p.match(/^\/video(-?\d+)_(\d+)/);
      if (m) return 'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2];
      return s;
    }
    if (host==='sendvid.com'){
      const m = p.match(/^\/(?:v|embed)\/([a-z0-9]+)/i) || p.match(/^\/([a-z0-9]+)$/i);
      if (m) return 'https://sendvid.com/embed/'+m[1];
      return s;
    }
    if (host==='ok.ru' || host==='odnoklassniki.ru'){
      const m = p.match(/^\/video(?:embed)?\/(\d+)/);
      if (m) return 'https://odnoklassniki.ru/videoembed/'+m[1];
      return s;
    }
    /* SIBNET (shell.php), MP4UPLOAD (embed-*.html), VOE (/e/), DOOD (/e/),
       MAIL.RU (video/embed), UQLOAD/HDVID/VUDEO/MVIDOO/VTUBE/STREAMSB (embed-*.html),
       FILEMOON/EMBEDO/HIGHLOAD/TUBELOAD (/e/), EMBEDGRAM (/v/), SAVEFILEWAY, CLONE... */
    return s;
  }catch(e){ return s; }
}
function srcLink(raw, tip){
  const s = cleanRawUrl(raw||'');
  if (tip==='url' && /^https?:\/\//i.test(s)) return s;
  if (s.startsWith('/')) return 'https://www.turkanime.net'+s;
  return (s && !BAD_SCHEME.test(s)) ? s : null;
}

/* ============ M1: veri yükleme (JSONP — file:// dahil her yerde çalışır) ============ */
function loadAnime(slug){
  if (dataCache.has(slug)) return dataCache.get(slug);
  const pr = new Promise((resolve,reject)=>{
    if (window.__TKA__ && Object.prototype.hasOwnProperty.call(window.__TKA__, slug)){
      resolve(window.__TKA__[slug]); return;
    }
    const s = document.createElement('script');
    const temizle = ()=>{ clearTimeout(to); if (s.parentNode) s.parentNode.removeChild(s); };
    const to = setTimeout(()=>{ temizle(); reject(new Error('zaman aşımı (b/'+slug+'.js)')); }, 30000);
    s.onerror = ()=>{ temizle(); reject(new Error('b/'+encodeURIComponent(slug)+'.js yüklenemedi')); };
    s.onload = ()=>{
      if (window.__TKA__ && Object.prototype.hasOwnProperty.call(window.__TKA__, slug)){
        resolve(window.__TKA__[slug]);
        try{ delete window.__TKA__[slug]; }catch(e){}
      } else reject(new Error('b/'+encodeURIComponent(slug)+'.js boş/hatalı'));
    };
    s.src = 'b/'+encodeURIComponent(slug)+'.js';
    document.head.appendChild(s);
  });
  dataCache.set(slug, pr);
  pr.catch(()=> dataCache.delete(slug));
  return pr;
}

/* ============ M6: indirme betiği üretimi ============ */
function fsSafe(s){ return String(s||'').replace(/[\\/:*?"<>|`$!\x00-\x1f]/g,'_'); }
/* URL'yi çift tırnak içinde güvenle kullanmak için: " ` $ \ ! boşluk ve kontrol karakterlerini %XX yap */
function safeArg(u){ return String(u||'').replace(/[\x00-\x20"`$\\!]/g, c=>'%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0')); }
function bolumBase(ep){ return ep.no!=null ? String(ep.no)+'. Bolum' : fsSafe(ep.slug); }
function firstUrlLink(ep){
  const ls = kaldirilanFiltre(ep.links).filter(l=> l.tip==='url');
  return ls.find(l=> l.durum!=='olu') || ls[0] || null;   // canlı tercih edilir
}
function ytCmd(url, outName){ return 'yt-dlp "'+safeArg(url)+'" -o "'+fsSafe(outName)+'"'; }
function buildIndirScripts(slug, data, tumu){
  const rows = data.map(ep=>({ep, links: kaldirilanFiltre(ep.links).filter(l=>l.tip==='url')}))
                   .filter(x=> x.links.length);
  const b = ['@echo off','chcp 65001 >nul','rem TurkAnime Arsiv - '+slug,
             'rem yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp',
             'rem kaldirilan linkler bu betikte yok','cd /d "%~dp0"',''];
  const s = ['#!/usr/bin/env bash','# TurkAnime Arsiv - '+slug,
             '# yt-dlp gerekli: https://github.com/yt-dlp/yt-dlp','# set -e',''];
  for (const {ep, links} of rows){
    const base = bolumBase(ep);
    const kullan = tumu ? links : [firstUrlLink(ep)];
    kullan.forEach((l,i)=>{
      let nm = base;
      if (tumu && i>0) nm = base+' ('+fsSafe(l.player)+')';
      const u = safeArg(l.url);
      const urlB = u.replace(/%/g,'%%');   // bat %% kuralı
      b.push('yt-dlp "'+urlB+'" -o "'+nm+'.mp4"');
      s.push('yt-dlp "'+u+'" -o "'+nm+'.mp4"');
    });
  }
  b.push('','pause');
  return { bat: b.join('\r\n')+'\r\n', sh: s.join('\n')+'\n' };
}
function indirFile(name, content, mime){
  const blob = new Blob([content], {type: mime||'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ============ arama ============ */
const PAGE = 60;
let lastQuery = '', lastPage = 1;

function searchAnime(q){
  const nq = norm(q);
  if (!nq) return [];
  const toks = nq.split(' ').filter(Boolean);
  const scored = [];
  for (const a of ANIME){
    let score = 0, ok = true;
    for (const t of toks){
      if (a.nTok.has(t)) continue;                                  // tam kelime
      let pre = false;
      for (const w of a.tokArr){ if (w.startsWith(t)){ pre = true; break; } }
      if (pre){ score += 1; continue; }                             // kelime başı: "mon" → monogatari
      if (t.length>=3 && a.hay.includes(t)){ score += 2; continue; } // kelime ortası
      ok = false; break;
    }
    if (ok) scored.push({a, score});
  }
  scored.sort((x,y)=>{
    const px = x.a.nTitle.startsWith(nq)?0:1, py = y.a.nTitle.startsWith(nq)?0:1;
    if (px!==py) return px-py;
    if (x.score!==y.score) return x.score-y.score;
    return x.a.nTitle < y.a.nTitle ? -1 : x.a.nTitle > y.a.nTitle ? 1 : 0;
  });
  return scored.map(x=>x.a);
}

function resultRow(a){
  return `<div class="result" data-slug="${esc(a.slug)}">
    <div style="min-width:0">
      <div class="rt">${esc(a.baslik)}</div>

        <span><b>${a.eps}</b> bölüm</span>
        <span><b>${a.urls}</b> url</span>

      </div>
      ${a.top.length?`<div class="players-chips">${a.top.map(p=>`<span class="pchip">${esc(p)}</span>`).join('')}</div>`:''}
    </div>
    <span class="go">›</span>
  </div>`;
}

function pagerHTML(page, total, perPage){
  const PP = perPage || PAGE;
  const pages = Math.max(1, Math.ceil(total/PP));
  if (pages<=1) return '';
  const btns = [];
  const win = [];
  for (let i=1;i<=pages;i++){
    if (i<=2 || i>pages-2 || Math.abs(i-page)<=2) win.push(i);
  }
  let prev=0;
  for (const i of win){
    if (prev && i-prev>1) btns.push('<span class="dots">…</span>');
    btns.push(`<button class="${i===page?'on':''}" data-pg="${i}">${i}</button>`);
    prev=i;
  }
  return `<div class="pager">
    <button data-pg="${Math.max(1,page-1)}" ${page<=1?'disabled':''}>‹</button>
    ${btns.join('')}
    <button data-pg="${Math.min(pages,page+1)}" ${page>=pages?'disabled':''}>›</button>
  </div>`;
}

    <div class="controls">
      <button class="btn" id="epIndir">⬇ Bu bölümü indir</button>
      <label class="tgl"><input type="checkbox" id="oluTgl" ${olu?'checked':''}> ölüleri göster</label>
      <span style="color:var(--tx3);font-size:13px">${shown.length} seçenek${deadCount?` · ${deadCount} ölü gizli`:''}${filtreli?' · filtreli':''}</span>
      ${ADMIN&&kaldirilanSay()?`<button class="btn ghost" id="exportBtn" title="henüz repoya eklenmemiş kaldırmaları el_degisiklikleri.json olarak indir">değişiklikleri dışa aktar (${kaldirilanSay()})</button>`:''}
    </div>
    ${chipRowHtml('Player', pCount, optSelPlayers, 'p')}
    ${chipRowHtml('Fansub', fCount, optSelFansubs, 'f')}
    <div id="optlist">
    ${shown.length? shown.map(x=>optRowHtml(x, num)).join('')
    : `<div class="empty"><div class="big">🚫</div>Görünür seçenek yok.${!olu?' Ölüleri açmayı dene.':filtreli?' Filtreleri temizle.':''}</div>`}
    </div>
    <div class="src">
      <span class="lbl">Konsol komutu:</span>
      <button class="copybtn" data-cmd="${esc(cmd)}">${esc(cmd)}</button>
    </div>
  `;
  document.title = `${meta.baslik} — ${ep.ad} | TürkAnime Arşiv`;
  const tgl = $('#oluTgl');
  if (tgl) tgl.onchange = ()=>{ oluGoster.set(tgl.checked); renderOptions(slug, data, bolumId); };
  const ei = $('#epIndir');
  if (ei) ei.onclick = ()=>{
    if (!ilkUrl){ alert('Bu bölümde indirilebilir url linki yok.'); return; }
    copyText(ytCmd(ilkUrl.url, num+'. Bolum.mp4')).then(()=> flashDone(ei,'kopyalandı ✓',1500,'⬇ Bu bölümü indir'));
  };
  const ex = $('#exportBtn');
  if (ex) ex.onclick = ()=>{
    const payload = {kaldirilan_url: bekleyenKaldirilan(), tarih: new Date().toISOString()};
    indirFile('el_degisiklikleri.json', JSON.stringify(payload, null, 2), 'application/json');
    flashDone(ex, 'indirildi ✓', 1500);
  };
  /* M3/M4 çip tıklama */
  appEl().querySelectorAll('.fchip[data-dim]').forEach(b=>{
    b.onclick = ()=>{
      const dim = b.dataset.dim, val = b.dataset.val;
      const set = dim==='p' ? optSelPlayers : optSelFansubs;
      if (set.has(val)) set.delete(val); else set.add(val);
      renderOptions(slug, data, bolumId);
    };
  });
  appEl().querySelectorAll('.fchip[data-temizle]').forEach(b=>{
    b.onclick = ()=>{
      if (b.dataset.temizle==='p') optSelPlayers = new Set();
      else optSelFansubs = new Set();
      renderOptions(slug, data, bolumId);
    };
  });
  appEl().querySelectorAll('.opt').forEach(el=>{
    el.onclick = (ev)=>{
      if (ev.target.closest('.mini')) return;
      location.hash = `#/anime/${encodeURIComponent(slug)}/${bolumId}/${el.dataset.pl}/${el.dataset.i}`;
    };
  });
  appEl().querySelectorAll('.mini').forEach(b=>{
    b.onclick = (ev)=>{
      ev.stopPropagation();
      const act = b.dataset.act, u = b.dataset.url;
      if (act==='kaldir'){
        linkKaldir(u);
        renderOptions(slug, data, bolumId);
        return;
      }
      if (act==='dl-mp4'){ copyText(ytCmd(u, num+'. Bolum.mp4')).then(()=> flashDone(b,'✓')); return; }
      if (act==='dl-g'){ copyText('yt-dlp -g "'+safeArg(u)+'"').then(()=> flashDone(b,'✓')); return; }
      if (act==='resolve'){ showResolve(b, u); return; }
    };
  });
  bindCopy();
}

/* ============ player görünümü ============ */
function renderPlayer(slug, data, bolumId, playerName, idxStr){
  const ep = findEp(data, bolumId);
  if (!ep){ appEl().innerHTML = `<div class="errbox">Bölüm bulunamadı: ${esc(bolumId)}</div>`; return; }
  const meta = ANIME.find(a=>a.slug===slug) || {baslik:slug};
  let pName;
  try { pName = decodeURIComponent(playerName); } catch(e){ pName = playerName; }
  const kaldi = kaldirilanSet();
  const cands = [];
  ep.links.forEach((l,i)=>{ if (l.player===pName && !kaldi.has(l.url)) cands.push({l,i}); });
  if (!cands.length){ appEl().innerHTML = `<div class="errbox">Player bulunamadı: ${esc(pName)}</div>`; return; }
  const idxRaw = parseInt(idxStr||'0',10)||0;
  let idx = cands.findIndex(c=>c.i===idxRaw);          // satırın gerçek linki
  if (idx===-1) idx = Math.min(Math.max(0, idxRaw), cands.length-1);
  const cur = cands[idx];
  const olu = oluGoster.get();
  const num = ep.no!=null?String(ep.no):ep.slug;
  const cmd = `turkanime_ara.py ${slug} --bolum ${num}`;
  const emb = embedUrl(cur.l.url, cur.l.tip);
  const src = srcLink(cur.l.url, cur.l.tip);
  const rawUrl = String(cur.l.url||'');
  const isHttpUrl = cur.l.tip==='url' && /^https?:\/\//i.test(rawUrl);
  const iframeHtml = emb
    ? `<div class="player-box"><iframe id="frm" src="${esc(emb)}" allowfullscreen referrerpolicy="no-referrer" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe></div>`
    : `<div class="note">Bu seçenek <b>${esc(cur.l.tip)}</b> tipinde; doğrudan gömülemiyor. Kaynak linkinden siteye gidip izleyebilirsin.</div>`;
  const dlGrp = isHttpUrl ? `
      <span class="grp">
        <button class="copybtn" data-cmd="${esc(ytCmd(rawUrl, num+'. Bolum.mp4'))}" title="embed adresiyle indir">yt-dlp (mp4)</button>
        <button class="copybtn" data-cmd="${esc('yt-dlp -g "'+safeArg(rawUrl)+'"')}" title="-g doğrudan akış/m3u8 linkini verir">m3u8 (yt-dlp -g)</button>
        ${SERVER_OK?`<button class="copybtn" data-act="resolve" data-url="${esc(rawUrl)}">akışı çöz (m3u8/mp4)</button>`:''}
      </span>` : '';
  appEl().innerHTML = `
    <div class="crumb">
      <a href="#/ara">Arama</a><span class="sep">›</span>
      <a href="#/anime/${encodeURIComponent(slug)}">${esc(meta.baslik)}</a><span class="sep">›</span>
      <a href="#/anime/${encodeURIComponent(slug)}/${bolumId}">${esc(ep.ad)}</a><span class="sep">›</span>
      <span>${esc(pName)}</span>
    </div>
    ${iframeHtml}
    <div class="note-soft">Player açılmadıysa (üçüncü parti host engelleyebilir) <b>kaynak linkini</b> kullan ya da yt-dlp komutuyla indir.</div>
    <div class="pmeta">
      <span class="pname">${esc(pName)}</span>
      ${badge(cur.l.durum)}
      <span class="tag ${tipClass(cur.l.tip)}">${esc(cur.l.tip)}</span>
      <span>${esc(cur.l.fansub)}</span>
    </div>
    ${cands.length>1?`<div class="fansub-chips">${cands.map((c,ci)=>`
      <button class="fchip ${ci===idx?'on':''}" data-ci="${ci}">
        ${esc(c.l.fansub)} ${dot(c.l.durum)} <span class="tag ${tipClass(c.l.tip)}">${esc(c.l.tip)}</span>
      </button>`).join('')}</div>`:''}
    ${src?`<div class="src"><span class="lbl">Kaynak:</span><a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(src)}</a></div>`:''}
    ${dlGrp?`<div class="src"><span class="lbl">İndir:</span>${dlGrp}</div>`:''}
    <div class="src">
      <span class="lbl">Konsol komutu:</span>
      <button class="copybtn" data-cmd="${esc(cmd)}">${esc(cmd)}</button>
    </div>
  `;
  document.title = `${meta.baslik}${ep.no!=null?' #'+ep.no:''} — ${pName} | TürkAnime Arşiv`;
  appEl().querySelectorAll('.fchip').forEach(b=>{
    b.onclick = ()=>{
      location.hash = `#/anime/${encodeURIComponent(slug)}/${bolumId}/${playerName}/${b.dataset.ci}`;
    };
  });
  const rv = appEl().querySelector('[data-act="resolve"]');
  if (rv) rv.onclick = ()=> showResolve(rv, rv.dataset.url);
  bindCopy();
}

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){}
    ta.remove(); return true;
  }
}
function flashDone(btn, txt, ms, restore){
  const old = restore!=null ? restore : btn.textContent;
  btn.classList.add('done'); btn.textContent = txt||'✓';
  setTimeout(()=>{ btn.classList.remove('done'); btn.textContent = old; }, ms||1400);
}
function bindCopy(){
  document.querySelectorAll('.copybtn').forEach(b=>{
    if (b.dataset.act) return;   // "çöz" gibi özel butonlar ayrı bağlanır
    b.onclick = ()=> copyText(b.dataset.cmd).then(()=> flashDone(b,'kopyalandı ✓'));
  });
}

/* ============ router ============ */
let routeToken = 0;

function showLoading(msg){
  appEl().innerHTML = `<div class="loading"><div class="spinner"></div><div>${esc(msg||'Yükleniyor...')}</div></div>`;
}

function route(){
  const tok = ++routeToken;
  const h = location.hash||'';
  document.title = 'TürkAnime Arşiv — İzle';
  if (!h || h==='#' || h==='#/' || h.startsWith('#/ara')){
    renderHome();
    if (lastQuery) $('#q').value = lastQuery;
    return;
  }
  const m = h.match(/^#\/anime\/([^/]+)(?:\/([^/]+))?(?:\/([^/]+))?(?:\/([^/]+))?/);
  if (!m){ location.hash = '#/ara'; return; }
  const slug = decodeURIComponent(m[1]);
  const bolumId = m[2], player = m[3], idx = m[4];
  showLoading('Bölümler yükleniyor...');
  loadAnime(slug).then(data=>{
    if (tok!==routeToken) return;
    if (bolumId && player) renderPlayer(slug, data, bolumId, player, idx);
    else if (bolumId) renderOptions(slug, data, bolumId);
    else { epPage = 1; renderAnime(slug, data); }
  }).catch(err=>{
    if (tok!==routeToken) return;
    appEl().innerHTML = `<div class="errbox"><b>${esc(slug)}</b> verisi yüklenemedi: ${esc(err.message)}<br>b/${esc(slug)}.js dosyası siteyle aynı klasörde olmalı.</div>`;
  });
}

/* ============ arama girişi ============ */
const qEl = document.getElementById('q');
qEl.addEventListener('input', debounce(()=>{
  lastQuery = qEl.value.trim();
  lastPage = 1;
  const h = location.hash||'';
  if (!h || h==='#' || h==='#/' || h.startsWith('#/ara')) renderHome();
  else if (lastQuery) location.hash = '#/ara';
}, 150));
document.addEventListener('keydown', e=>{
  if (e.key==='/' && document.activeElement!==qEl && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); qEl.focus();
  }
});

/* ============ boot ============ */
if (ADMIN){ const b = document.getElementById('admBadge'); if (b) b.hidden = false; }
window.addEventListener('hashchange', route);
route();
pingServer();  // M7b: yardımcı sunucu varsa "çöz" butonları görünür olur
</script>
