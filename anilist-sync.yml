name: AniList senkronizasyonu

# Ne yapar: assets/data.js'deki her anime için AniList'ten kapak/tür/puan/özet
# çeker, özeti Türkçeye çevirir, kapağı AVIF'e dönüştürür; assets/covers/*.avif
# ve assets/anilist/*.json olarak repoya commit'ler. Böylece siteyi ziyaret
# eden hiç kimsenin tarayıcısı AniList'e canlı istek atmaz.
#
# - Zamanlanmış: haftada bir, yeni eklenen animeleri yakalamak için
# - Elle: Actions sekmesinden "Run workflow"
# - Otomatik: assets/data.js değiştiğinde (yeni anime eklendiğinde)
#
# Önceden işlenmiş slug'lar atlanır (script varsayılan olarak --force almaz),
# bu yüzden ilk çalıştırma hariç birkaç dakikada biter.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Hepsini yeniden indir (--force)"
        type: boolean
        default: false
      limit:
        description: "En fazla N anime işle (test için, 0 = sınırsız)"
        type: string
        default: "0"
  schedule:
    - cron: "17 3 * * 1"   # her Pazartesi 03:17 UTC
  push:
    branches: [main]
    paths:
      - "assets/data.js"

permissions:
  contents: write

concurrency:
  group: anilist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r scripts/requirements.txt

      - name: AniList verisini çek + çevir + AVIF üret
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/fetch_anilist.py $ARGS

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/covers assets/anilist
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "AniList verisi güncellendi (${COUNT} dosya)"
            git push
          fi
